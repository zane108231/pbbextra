name = "pbbextra"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# Worker handles /stream/* and /d/* first, then falls through to static assets
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Chat + live viewer count backend (single global room)
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# iWantTFC entitlement relay (playback/start is blocked from CF IPs —
# see replay-relay.js, deploy on Render and set this to its URL)
[vars]
REPLAY_RELAY_URL = "https://pbbextra.onrender.com"
